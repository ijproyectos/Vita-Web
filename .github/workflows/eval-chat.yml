# Manual eval of the vita chat agent. Calls the Anthropic API (costs real money, ~US$0.5 per run).
# Only runs on demand. Requires the repository secret ANTHROPIC_API_KEY (added by the owner).
name: Eval chat

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Only cases whose id contains this text (empty = all)"
        required: false
        default: ""
      repeticiones:
        description: "Repetitions per case"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  eval:
    name: eval-chat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run chat eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FILTRO: ${{ inputs.filtro }}
          REPETICIONES: ${{ inputs.repeticiones }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "Missing secret ANTHROPIC_API_KEY"; exit 2; fi
          args=(--repeticiones "${REPETICIONES:-1}")
          if [ -n "$FILTRO" ]; then args+=(--filtro "$FILTRO"); fi
          npm run eval:chat -- "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-chat-report
          path: apps/web/evals/chat/resultados/
          if-no-files-found: ignore
