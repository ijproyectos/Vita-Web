<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>vita</title>
    <style>
      :root { --teal: #0d9b8e; --teal-deep: #0a7a6e; --cream: #faf8f4; --ink: #0f1923; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--cream);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0 0 24px; font-size: 1.125rem; line-height: 1.5; }
      button {
        min-height: 56px;
        padding: 0 32px;
        border: 0;
        border-radius: 16px;
        background: var(--teal);
        color: #fff;
        font-size: 1.125rem;
        font-weight: 600;
      }
      button:active { background: var(--teal-deep); }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No pudimos conectarnos. Revisá tu internet y probá de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
